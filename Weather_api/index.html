<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The weather app</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>What is the weather</h1>
<form class="questions">

</section
