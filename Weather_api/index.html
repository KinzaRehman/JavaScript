<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The weather app</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>What is the weather</h1>
<form class="input">
    <input type="text" id="country" placeholder="Country">
    <input type="text" id="City" placeholder="What City are you from?">
    <button type="submit"> Get Weather</button>
</form>
<section class="output"> 
    <h2 class="country">USA</h2>
    <h2 class="city">NYC</h2>
    <p class="date">9/22/2026</p>
    <p class="temperature">63</p>
    <p class="text"> Text information about the weather</p>
</section>

<script src="main.js"> </script>

</body>
</html>
