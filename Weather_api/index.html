<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The weather app</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>What is the weather</h1>
<form class="input">
   <input type="text" id="country" placeholder="Country ex: US, PK, JP">
    <input type="text" id="City" placeholder="City ex: New York, Islamabad, Tokyo" >
    <button id="submit" type="submit">Get Weather</button>
</form>
<section class="output"> 
    <h2 class="country">Country: US</h2>
    <h2 class="city">City: New York</h2>
    <p class="date">Date: 9/22/2026</p>
    <p class="temperatureC">Temp °C: </p>
    <p class="temperatureF">Temp °F:</p>
    <p class="text"> Condition: </p>
</section>

<script src="main.js"> </script>

</body>
</html>
